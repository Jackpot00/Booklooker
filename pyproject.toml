[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "booklooker-client"
version = "0.1.0"
description = "Small Python client for the Booklooker REST API v2.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.0",
]

[tool.setuptools.packages.find]
include = ["booklooker_client*"]
